version: 1

project:
  title: Automated notebook validation with Jupyter4NFDI
  github: https://github.com/apawlik/learn-jupyter4nfdi-automated-validation
  authors:
    - name: Aleksandra Pawlik
      orcid: https://orcid.org/0000-0001-8418-6735

  toc:
    - file: modules/01_introduction.md
    - file: modules/02_repo2docker.md
